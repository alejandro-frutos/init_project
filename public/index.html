<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Item Management System</h1>
    
    <div class="form-section">
      <h2>Add New Item</h2>
      <form id="itemForm">
        <input type="text" id="name" placeholder="Item Name" required>
        <textarea id="description" placeholder="Item Description"></textarea>
        <input type="number" id="price" placeholder="Price" step="0.01" required>
        <input type="number" id="quantity" placeholder="Quantity" value="1" required>
        <button type="submit">Add Item</button>
      </form>
    </div>

    <div class="items-section">
      <h2>Items List</h2>
      <button id="refreshBtn" class="refresh-btn">Refresh Items</button>
      <div id="itemsList" class="items-container"></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Item</h2>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editId">
        <input type="text" id="editName" placeholder="Item Name" required>
        <textarea id="editDescription" placeholder="Item Description"></textarea>
        <input type="number" id="editPrice" placeholder="Price" step="0.01" required>
        <input type="number" id="editQuantity" placeholder="Quantity" required>
        <div class="modal-actions">
          <button type="submit" class="btn-save">Save Changes</button>
          <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
